<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');

d var(--line);margin-bottom:14px}.tab{border:0;border-bottom:2px solid transparent;background:none;color:#aaa;padding:10px 14px;font-size:11px}.tab.active{color:#dfc6a7;border-color:var(--bronze)}.modal-bg{position:fixed;inset:0;z-index:30;background:#000b;display:grid;place-items:center;padding:18px}.modal{width:min(500px,100%);max-height:90vh;overflow:auto;background:#171719;border:1px solid #51463a;padding:24px}.modal h2{font-size:23px;margin:10px 0}.modal p{color:#a49c93;font-size:11px;line-height:1.6}.form{display:grid;gap:12px}.form label{display:grid;gap:6px;color:#b8b0a7;font-size:10px}.form input,.form select{background:#0d0d0f;border:1px solid #48413a;color:#eee;padding:11px}.form-actions{display:flex;justify-content:end;gap:9px;margin-top:16px}.close{float:right;background:none;border:0;color:#ddd;font-size:23px}.cart-list{margin:15px 0}.cartline{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #393532;font-size:11px}.toast{position:fixed;z-index:50;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--stone);color:#1f1f23;padding:12px 17px;font-size:11px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:850px){.nav{gap:13px}.services,.products{grid-template-columns:repeat(2,1fr)}.pillar-grid{grid-template-columns:repeat(2,1fr)}.dashboard{grid-template-columns:70px 1fr}.sidebar{padding:20px 7px}.side-title,.side-text{display:none}.side-link{justify-content:center;padding:12px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.topbar{height:65px;padding:0 13px}.logo{width:42px}.brand{gap:5px}.brand-text{font-size:16px}.nav{display:none}.role{font-size:9px;padding:8px 5px}.actions>.btn{display:none}.note{display:block;line-height:1.7;padding:9px 15px}.hero{min-height:610px;display:block;padding:48px 23px}.hero h1{font-size:48px}.hero-copy{position:absolute;bottom:42px}.mark{position:absolute;width:205px;height:205px;right:-45px;top:25px;opacity:.35}.mark svg{width:150px}.section{padding:54px 20px}.heading{display:block}.journey{grid-template-columns:1fr;gap:17px}.services,.products{gap:8px}.card{padding:13px;min-height:190px}.card h3{font-size:14px;margin-top:14px}.card p{font-size:10px}.bottom{font-size:10px;gap:6px}.pillar-grid{gap:20px 5px}.pillar{padding:7px 10px}.footer{display:block;line-height:2;padding:23px 19px}.dashboard{display:block;padding-bottom:59px}.sidebar{position:fixed;z-index:15;left:0;right:0;bottom:0;height:58px;display:flex;justify-content:space-around;padding:4px;background:#101012ef;border:0;border-top:1px solid var(--line)}.side-link{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 8px;border:0;font-size:8px}.side-text{display:block}.side-icon{width:auto;font-size:14px}.side-title{display:none}.main{padding:22px 13px 25px}.dash-head h1{font-size:24px}.stat{padding:13px}.stat strong{font-size:21px}.panel{padding:14px}.row{gap:7px}.row-date{min-width:60px;font-size:9px}.row-main strong{font-size:10px}.row .btn{font-size:8px;padding:7px}.badge{font-size:8px;padding:4px}.tabs{overflow:auto}.tab{white-space:nowrap;padding:10px}.form-actions .btn{padding:10px}}
</style></head><body><div id="app"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const services=[{id:1,name:'Corte clássico',description:'Corte personalizado com acabamento à navalha.',price:7500,duration:45},{id:2,name:'Barba & contorno',description:'Toalha quente, desenho e finalização.',price:5500,duration:30},{id:3,name:'Corte + barba',description:'Experiência completa de cabelo e barba.',price:11000,duration:75},{id:4,name:'Camuflagem capilar',description:'Disfarce natural de fios brancos.',price:8500,duration:45}];
const products=[{id:1,name:'Pomada Matte Norden',category:'Finalização',description:'Fixação natural, acabamento sem brilho.',price:8900,stock:12},{id:2,name:'Óleo de Barba',category:'Barba',description:'Blend nutritivo para barba e pele.',price:6900,stock:8},{id:3,name:'Shampoo Purificante',category:'Cabelo',description:'Limpeza suave para uso frequente.',price:5900,stock:15},{id:4,name:'Pente de Madeira',category:'Acessórios',description:'Pente de bolso com dentes largos.',price:3900,stock:6}];const pros=[{id:1,name:'Rafael Almeida',specialty:'Corte e visagismo'},{id:2,name:'Caio Mendes',specialty:'Barba e tratamentos'}];
let state={role:'client',view:'home',userId:1,cart:{},appointments:JSON.parse(localStorage.getItem('norden_demo_appts')||'[]'),orders:JSON.parse(localStorage.getItem('norden_demo_orders')||'[]'),filter:'all'};const $=s=>document.querySelector(s),money=v=>(v/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const user=()=>state.role==='admin'?{id:2,name:'Rafael Almeida'}:{id:1,name:'Lucas Martins'};function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)}function datefmt(d){return new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function logo(){return `<svg class="logo" viewBox="0 0 100 100" role="img" aria-label="Símbolo NORDEN"><g fill="none" stroke="#c6a47c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M50 7 36 35l13-8 7 9 7-9 13 8z" fill="#a27a4f"/><path d="m25 27 26 35M75 27 49 62M29 43 17 72l26-19M71 43l12 29-26-19"/><path d="m50 62 27-42M50 63 22 89" stroke-width="4"/><circle cx="50" cy="62" r="3" fill="#171514"/><path d="M43 70c-10 2-16 9-16 17 0 6 4 10 10 10 5 0 9-4 9-8s-3-7-7-7M57 70c10 2 16 9 16 17 0 6-4 10-10 10-5 0-9-4-9-8s3-7 7-7"/></g></svg>`}
function header(){return `<header class="topbar"><a class="brand" href="#" onclick="go('home');return false">${logo()}<span class="brand-text">NORDEN<small>SALÃO MASCULINO PREMIUM</small></span></a><nav class="nav"><a href="#servicos" onclick="go('home')">Serviços</a><a href="#experiencia" onclick="go('home')">Experiência</a><a href="#loja" onclick="go('store')">Loja</a><a href="#" onclick="go(state.role==='admin'?'dashboard':'account');return false">Minha conta</a></nav><div class="actions"><select class="role" onchange="switchRole(this.value)" aria-label="Alternar demonstração"><option value="client" ${state.role==='client'?'selected':''}>Demo · Cliente</option><option value="admin" ${state.role==='admin'?'selected':''}>Demo · Gestão</option></select><button class="btn sm" onclick="bookModal()">Agendar</button></div></header>`}
function footer(){return `<footer class="footer"><span>© NORDEN · Protótipo demonstrativo</span><span>Serviços, preços, profissionais e estoque fictícios</span></footer>`}
function productCard(p){return `<article class="card product"><div class="product-visual">${p.category==='Barba'?'◈':p.category==='Cabelo'?'⌁':p.category==='Acessórios'?'⌑':'◇'}</div><span class="eyebrow">${esc(p.category)} · ${p.stock} disponíveis</span><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><div class="bottom"><span class="price">${money(p.price)}</span><button class="btn sm" onclick="addCart(${p.id})">ADICIONAR</button></div></article>`}
function home(){return `${header()}<div class="note"><span>AMBIENTE DE DEMONSTRAÇÃO — dados e preços ilustrativos.</span><span>Frontend navegável · sem conexão com backend ou pagamentos.</span></div><section class="hero"><div class="hero-copy"><div class="eyebrow">MEN'S CARE · EXPERIENCE · EVOLUTION</div><h1>Seu estilo.<br><em>Sua evolução.</em></h1><p>Uma experiência de cuidado masculino pensada para acompanhar você antes, durante e depois de cada visita.</p><div class="hero-ctas"><button class="btn" onclick="bookModal()">RESERVE SEU HORÁRIO ↗</button><button class="btn alt" onclick="go('store')">EXPLORAR A LOJA</button></div></div><div class="mark">${logo()}</div></section><section class="section" id="servicos"><div class="heading"><div><div class="eyebrow">PRECISÃO EM CADA DETALHE</div><h2>Serviços</h2><p class="intro">Conheça as experiências NORDEN. Valores e durações demonstrativos.</p></div><button class="btn alt sm" onclick="bookModal()">VER HORÁRIOS</button></div><div class="services">${services.map((s,i)=>`<article class="card"><span class="num">0${i+1} / EXPERIÊNCIA</span><h3>${s.name}</h3><p>${s.description}</p><div class="bottom"><span class="price">${money(s.price)}</span><span class="duration">${s.duration} MIN</span></div></article>`).join('')}</div></section><section class="section light" id="experiencia"><div class="eyebrow">SEU CUIDADO, EM CONTINUIDADE</div><h2>Antes. Durante. Depois.</h2><div class="journey"><article><b>01 — ANTES</b><h3>Escolha sem dúvidas</h3><p>Consulte serviços e horários, selecione o profissional e reserve em poucos passos.</p></article><article><b>02 — DURANTE</b><h3>Feito para você</h3><p>O profissional registra o procedimento e os produtos realmente utilizados.</p></article><article><b>03 — DEPOIS</b><h3>O estilo continua</h3><p>Acesse seu histórico, consulte orientações de cuidado e encontre produtos para sua rotina.</p></article></div></section><section class="section pillars"><div class="eyebrow">EXPERIÊNCIA INTEGRADA</div><h2>O ecossistema NORDEN</h2><div class="pillar-grid"><article class="pillar"><b>FLOW</b><p>Sugestões de encaixe após cancelamentos, sempre com confirmação do cliente.</p></article><article class="pillar"><b>JOURNEY</b><p>Linha do tempo dos procedimentos concluídos e produtos usados.</p></article><article class="pillar"><b>CARE</b><p>Orientações pós-atendimento revisadas pelo profissional.</p></article><article class="pillar"><b>STORE</b><p>Produtos, carrinho, pedidos e estoque integrados.</p></article></div></section><section class="section" id="loja"><div class="heading"><div><div class="eyebrow">CURADORIA NORDEN</div><h2>Escolhas para sua rotina</h2></div><button class="btn alt sm" onclick="go('store')">VISITAR A LOJA ↗</button></div><div class="products">${products.map(productCard).join('')}</div></section>${footer()}`}
function links(){let arr=state.role==='admin'?[['dashboard','⌂','Visão geral'],['agenda','▦','Agenda'],['flow','↗','NORDEN Flow'],['clients','♙','Clientes'],['store','◇','Produtos'],['orders','▤','Pedidos']]:[['account','⌂','Início'],['appointments','▦','Agendamentos'],['journey','◷','Minha jornada'],['store','◇','Loja'],['orders','▤','Pedidos'],['profile','♙','Meu perfil']];return `<aside class="sidebar"><div class="side-title">${state.role==='admin'?'OPERAÇÃO':'MINHA CONTA'}</div>${arr.map(([v,i,l])=>`<a class="side-link ${state.view===v?'active':''}" href="#" onclick="go('${v}');return false"><span class="side-icon">${i}</span><span class="side-text">${l}</span></a>`).join('')}</aside>`}
function dash(title,subtitle,body,cta=''){return `${header()}<div class="dashboard">${links()}<main class="main"><div class="dash-head"><div><div class="eyebrow">${state.role==='admin'?'PAINEL DA EQUIPE':'ÁREA DO CLIENTE'}</div><h1>${title}</h1><p>${subtitle}</p></div>${cta}</div>${body}</main></div>${footer()}`}
function stat(a,b,c){return `<div class="stat"><label>${a}</label><strong>${b}</strong><small>${c}</small></div>`}
function apptRow(a,admin=false){return `<div class="row"><div class="row-date">${datefmt(a.starts_at)}</div><div class="row-main"><strong>${admin?a.client+' · ':''}${a.service}</strong><p>${admin?'com ':''}${a.professional} · ${a.duration} min</p></div><span class="badge">${a.status==='completed'?'Concluído':a.status==='cancelled'?'Cancelado':'Confirmado'}</span>${a.status==='confirmed'?`<button class="btn sm" onclick="cancelAppt(${a.id})">CANCELAR</button>`:''}${admin&&a.status==='confirmed'?`<button class="btn sm" onclick="completeAppt(${a.id})">FINALIZAR</button>`:''}${a.status==='completed'?`<button class="btn alt sm" onclick="toast('Orientações de cuidado demonstrativas')">CARE</button>`:''}</div>`}
function account(){let my=state.appointments.filter(a=>a.user_id===1),next=my.find(a=>a.status==='confirmed');return dash('Olá, Lucas.', 'Seu próximo cuidado começa por aqui.',`${next?`<section class="panel"><div class="panel-head"><h3>Seu próximo horário</h3><span class="badge">RESERVADO</span></div>${apptRow(next)}</section>`:`<section class="panel"><div class="empty">Você ainda não tem horário reservado.<br><button class="btn sm" style="margin-top:12px" onclick="bookModal()">AGENDAR MEU HORÁRIO</button></div></section>`}<div class="stats">${stat('ATENDIMENTOS CONCLUÍDOS',my.filter(a=>a.status==='completed').length,'Sua jornada')}${stat('PEDIDOS',state.orders.length,'Acompanhe suas compras')}${stat('PRODUTOS',products.length,'Curadoria de cuidado')}${stat('PERFIL','●','Dados demonstrativos')}</div><section class="panel"><div class="panel-head"><h3>Continue sua jornada</h3><button class="btn alt sm" onclick="go('journey')">ABRIR JOURNEY</button></div><p class="intro">Seu histórico e orientações de cuidado aparecem após o primeiro atendimento concluído.</p></section>`,'<button class="btn" onclick="bookModal()">+ AGENDAR</button>')}
function appointments(){let list=state.appointments.filter(a=>a.user_id===1);return dash('Meus agendamentos','Reservas e histórico em um só lugar.',`<div class="tabs"><button class="tab active">Todos</button><button class="tab" onclick="toast('Filtro demonstrativo')">Próximos</button><button class="tab" onclick="toast('Filtro demonstrativo')">Histórico</button></div><section class="panel">${list.map(a=>apptRow(a)).join('')||'<div class="empty">Nenhum agendamento por aqui.</div>'}</section>`,'<button class="btn" onclick="bookModal()">+ NOVO HORÁRIO</button>')}
function journey(){let list=state.appointments.filter(a=>a.user_id===1&&a.status==='completed');return dash('NORDEN Journey','Seu histórico de procedimentos e cuidados.',`<section class="panel"><div class="panel-head"><h3>Linha do tempo</h3></div>${list.map(a=>apptRow(a)).join('')||'<div class="empty">Sua jornada começa no primeiro atendimento concluído.</div>'}</section>`)}
function store(){return dash('NORDEN Store','Produtos de cuidado masculino · catálogo demonstrativo.',`<section class="panel"><div class="panel-head"><h3>Curadoria de produtos</h3><button class="btn alt sm" onclick="go('cart')">CARRINHO (${Object.values(state.cart).reduce((a,b)=>a+b,0)})</button></div><div class="products">${products.map(productCard).join('')}</div></section>`)}
function cart(){let rows=Object.entries(state.cart).map(([id,q])=>({p:products.find(p=>p.id===+id),q})).filter(x=>x.p),total=rows.reduce((s,x)=>s+x.p.price*x.q,0);return dash('Seu carrinho','Revise os produtos selecionados.',`<section class="panel">${rows.map(x=>`<div class="cartline"><span>${x.p.name} · ${x.q} un.</span><strong>${money(x.p.price*x.q)}</strong></div>`).join('')||'<div class="empty">Seu carrinho está vazio.</div>'}<div class="cartline"><strong>Subtotal</strong><strong>${money(total)}</strong></div></section>${rows.length?'<button class="btn" onclick="checkout()">CONTINUAR PARA ENTREGA</button>':''}`)}
function orders(){return dash('Pedidos','Acompanhe suas compras demonstrativas.',`<section class="panel"><div class="panel-head"><h3>Meus pedidos</h3><span class="badge">PAGAMENTO PRESENCIAL</span></div>${state.orders.map(o=>`<div class="row"><div class="row-main"><strong>Pedido #${o.id} · ${o.mode==='delivery'?'Entrega estimada':'Retirada no salão'}</strong><p>${money(o.total)} · pagamento presencial</p></div><span class="badge">${o.status}</span></div>`).join('')||'<div class="empty">Nenhum pedido registrado.</div>'}</section>`)}
function profile(){return dash('Meu perfil','Preferências da demonstração.',`<section class="panel"><div class="row"><div class="row-main"><strong>Lucas Martins</strong><p>lucas@norden.demo</p></div></div><p class="intro">Esta versão de compartilhamento usa dados fictícios e não envia informações ao servidor.</p></section>`)}
function dashboard(){return dash('Visão geral','Operação do salão · ambiente demonstrativo.',`<div class="stats">${stat('HORÁRIOS HOJE',0,'Agenda local')}${stat('RESERVAS ATIVAS',state.appointments.filter(a=>a.status==='confirmed').length,'Confirmadas')}${stat('PEDIDOS',state.orders.length,'Demonstração')}${stat('PRODUTOS',products.length,'Catálogo')}</div><section class="panel"><div class="panel-head"><h3>Agenda profissional</h3><button class="btn alt sm" onclick="go('agenda')">VER AGENDA</button></div>${state.appointments.map(a=>apptRow(a,true)).join('')||'<div class="empty">As reservas de demonstração aparecem aqui.</div>'}</section><section class="panel"><h3>Produtos em estoque</h3>${products.map(p=>`<div class="row"><div class="row-main"><strong>${p.name}</strong><p>${p.category}</p></div><span class="badge">${p.stock} un.</span></div>`).join('')}</section>`,'<button class="btn" onclick="go(\'agenda\')">ABRIR AGENDA</button>')}
function agenda(){return dash('Agenda profissional','Reservas e atendimentos demonstrativos.',`<section class="panel">${state.appointments.map(a=>apptRow(a,true)).join('')||'<div class="empty">Nenhum horário reservado.</div>'}</section>`)}function flow(){return dash('NORDEN Flow','Sugestões de encaixe dependem da confirmação do cliente.',`<section class="panel"><h3>Ofertas de encaixe</h3><div class="empty">Quando uma reserva for cancelada, esta área apresenta uma sugestão demonstrativa.</div></section><section class="panel"><h3>Reservas</h3>${state.appointments.map(a=>apptRow(a,true)).join('')}</section>`)}function clients(){return dash('Clientes','Perfis fictícios da demonstração.',`<section class="panel"><div class="row"><div class="row-main"><strong>Lucas Martins</strong><p>lucas@norden.demo</p></div><span class="badge">CLIENTE DEMO</span></div></section>`)}
function render(){let views={home,account,appointments,journey,store,cart,orders,profile,dashboard,agenda,flow,clients};$('#app').innerHTML=(views[state.view]||home)()}function go(v){state.view=v;render();window.scrollTo(0,0)}function switchRole(v){state.role=v;state.view=v==='admin'?'dashboard':'account';render()}
function showModal(title,desc,body,submit,fn){let w=document.createElement('div');w.className='modal-bg';w.innerHTML=`<section class="modal"><button class="close" onclick="this.closest('.modal-bg').remove()">×</button><div class="eyebrow">NORDEN · DEMONSTRAÇÃO</div><h2>${title}</h2><p>${desc}</p>${body}<div class="form-actions"><button class="btn alt" onclick="this.closest('.modal-bg').remove()">VOLTAR</button><button class="btn" id="submit-demo">${submit}</button></div></section>`;document.body.appendChild(w);$('#submit-demo').onclick=()=>fn(w)}
function bookModal(){showModal('Reserve seu horário','Escolha serviço, profissional e horário. Esta demonstração guarda a reserva neste navegador.',`<form class="form"><label>Serviço<select name="service">${services.map(s=>`<option value="${s.id}">${s.name} · ${money(s.price)} · ${s.duration} min</option>`).join('')}</select></label><label>Profissional<select name="pro">${pros.map(p=>`<option value="${p.id}">${p.name} · ${p.specialty}</option>`).join('')}</select></label><label>Data e horário<input name="when" type="datetime-local" required></label></form>`,'CONFIRMAR RESERVA',w=>{let f=w.querySelector('form'),d=new FormData(f),s=services.find(x=>x.id===+d.get('service')),p=pros.find(x=>x.id===+d.get('pro'));if(!d.get('when')){toast('Escolha data e horário.');return}state.appointments.push({id:Date.now(),user_id:state.role==='admin'?1:1,service:s.name,professional:p.name,duration:s.duration,starts_at:d.get('when'),status:'confirmed'});localStorage.setItem('norden_demo_appts',JSON.stringify(state.appointments));w.remove();toast('Reserva demonstrativa adicionada.');go(state.role==='admin'?'agenda':'appointments')})}
function cancelAppt(id){let a=state.appointments.find(x=>x.id===id);if(a){a.status='cancelled';localStorage.setItem('norden_demo_appts',JSON.stringify(state.appointments));render();toast('Reserva cancelada na demonstração.')}}function completeAppt(id){let a=state.appointments.find(x=>x.id===id);if(a){a.status='completed';localStorage.setItem('norden_demo_appts',JSON.stringify(state.appointments));render();toast('Atendimento concluído na demonstração.')}}function addCart(id){state.cart[id]=(state.cart[id]||0)+1;toast('Produto adicionado ao carrinho.');if(state.view==='store')render()}function checkout(){let total=Object.entries(state.cart).reduce((s,[id,q])=>s+products.find(p=>p.id===+id).price*q,0);showModal('Finalizar pedido','Checkout visual demonstrativo. Nenhuma cobrança será feita.',`<div class="form"><label>Como deseja receber?<select id="mode"><option value="pickup">Retirada no salão</option><option value="delivery">Entrega estimada</option></select></label><p>Total demonstrativo: <strong>${money(total)}</strong> · pagamento presencial.</p></div>`,'CRIAR PEDIDO DEMO',w=>{state.orders.push({id:state.orders.length+1,total,mode:w.querySelector('#mode').value,status:'Recebido'});localStorage.setItem('norden_demo_orders',JSON.stringify(state.orders));state.cart={};w.remove();toast('Pedido de demonstração criado.');go('orders')})}
render();
</script></body></html>
